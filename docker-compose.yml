version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ruraldr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_sih26038
      MYSQL_DATABASE: ruraldr_db
      MYSQL_USER: ruraldr_user
      MYSQL_PASSWORD: ruraldr_password_sih
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_sih26038"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ruraldr_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://ruraldr_user:ruraldr_password_sih@mysql:3306/ruraldr_db
      JWT_SECRET_KEY: ruraldr-xai-super-secret-production-key-sih26038
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ruraldr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  mysql_data:
