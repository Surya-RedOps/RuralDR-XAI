[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruraldr-xai"
version = "1.0.0"
description = "Explainable AI for Diabetic Retinopathy Screening in Rural India (SIH26038)"
